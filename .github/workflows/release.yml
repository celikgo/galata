# SPDX-License-Identifier: Apache-2.0
#
# Release packaging.
#
# Charter rule 2 applies to a release asset exactly as it applies to a document:
# a binary attached to a release is a claim that this code, at this tag, builds
# and passes its own gates on that platform. So this workflow does not just
# compile — it invokes the complete CI graph for one resolved commit and refuses
# to package anything without that exact source evidence. An artefact that shipped without its tests run is a
# claim nobody checked.
#
# The archive carries the models and the examples alongside the binary, because
# the README's quickstart resolves its model through a relative path. A CLI
# shipped without them downloads as a program with nothing to run.
#
# Two triggers:
#   * pushing a tag matching v* — the normal path for a new release;
#   * workflow_dispatch with a tag name — the backfill path, used to attach
#     assets to a tag that was published before this workflow existed. The
#     workflow definition comes from the selected dispatch branch; the SOURCE
#     is resolved from the tag once. Tags predating the required gate scripts
#     are unsupported rather than silently packaged without the current checks.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag containing the current assurance infrastructure'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: "1"

jobs:
  # Resolve the tag once, so the matrix jobs and the publish job cannot
  # disagree about which commit they are talking about.
  resolve:
    name: Resolve tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      source_sha: ${{ steps.pick.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: pick
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/resolve-release.py "$REQUESTED_TAG"

  verify-ci:
    name: Complete CI for release source
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}

  package:
    name: Package (${{ matrix.name }})
    needs: [resolve, verify-ci]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-24.04,  preset: ci-linux-gcc }
          - { name: macos-arm64,    os: macos-14,      preset: ci-macos }
          - { name: windows-x86_64, os: windows-2022, preset: ci-windows }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Package only the CI-verified source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          VERIFIED_SOURCE_SHA: ${{ needs.verify-ci.outputs.source_sha }}
        run: python3 scripts/check-ci-source.py

      - uses: actions/download-artifact@v4
        with:
          name: ci-evidence-${{ needs.resolve.outputs.source_sha }}
          path: ${{ runner.temp }}/ci-evidence

      - name: Release tag names the source version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: test "$(cat VERSION)" = "${RELEASE_TAG#v}"

      - uses: ./.github/actions/setup-cpp
        with:
          preset: ${{ matrix.preset }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The gate that makes the asset mean something.
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package current sources and smoke-test the extracted CLI
        shell: bash
        env:
          RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: >-
          python3 scripts/package-release.py "build/${{ matrix.preset }}"
          --output-dir release-assets --release-sha "$RELEASE_SOURCE_SHA"
          --ci-evidence "$RUNNER_TEMP/ci-evidence/ci-evidence.json"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach assets to the release
    needs: [resolve, verify-ci, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ci-evidence-${{ needs.resolve.outputs.source_sha }}
          path: ${{ runner.temp }}/ci-evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      - name: Verify all package identities against complete CI evidence
        env:
          RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: >-
          python3 scripts/check-release-evidence.py assets
          "$RUNNER_TEMP/ci-evidence/ci-evidence.json" "$RELEASE_SOURCE_SHA"

      - name: One checksum file for the whole release
        working-directory: assets
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/ci-evidence/ci-evidence.json" CI-EVIDENCE.json
          rm -f ./*.sha256
          sha256sum ./* | sort -k2 > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la

      # --clobber so a re-run replaces assets rather than failing on a name
      # that already exists. The release itself is created by hand, with notes
      # written for the commit it points at; this workflow only attaches files
      # and will not invent a release that a person did not intend.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::no GitHub release exists for $TAG."
            echo "Create it first, with notes describing what is true at that commit:"
            echo "  gh release create $TAG --title ... --notes-file ..."
            exit 1
          fi
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          python3 scripts/resolve-release.py "$TAG" --expected-sha "$RELEASE_SOURCE_SHA"
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes"'

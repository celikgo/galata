# SPDX-License-Identifier: Apache-2.0
#
# Publishes the documentation site.
#
# The site is the repository's own Markdown, rendered. It adds no content: if a
# sentence is on the site, it is in a file in this repository, and it got there
# through the same review as everything else. docs/VERIFICATION.md in particular
# is generated by the validation suite and diffed by CI, so the V&V numbers the
# site serves are the numbers the code produced — publishing them somewhere
# prettier does not make them any less checked.
#
# Deliberately NOT a Jekyll build from /docs. Jekyll renders only files that
# carry YAML front matter, and adding front matter to docs/VERIFICATION.md would
# break the generator diff in ci.yml permanently. scripts/build-docs-site.py
# reads the sources and writes HTML elsewhere, leaving them untouched.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/assets/**'
      - 'scripts/build-docs-site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Never cancel a deploy in flight; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # Pinned: a renderer that changes its table or code-block output between
      # versions would silently change every page on the site.
      - name: Install the Markdown renderer
        run: python -m pip install --quiet 'markdown==3.7'

      - name: Render
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 scripts/build-docs-site.py _site
          test -s _site/index.html
          test -s _site/verification.html

      # A relative link that survived the rewrite is a link to a file that does
      # not exist — the site's equivalent of charter rule 4, checked here
      # because ci.yml's link gate reads the Markdown, not the HTML.
      - name: Every relative link was resolved
        run: |
          set -euo pipefail
          leftover="$(grep -rhoE 'href="[^"]+"' _site --include='*.html' \
            | sort -u | grep -vE 'https?://|\.html"|\.html#|^href="#' || true)"
          if [ -n "$leftover" ]; then
            echo "::error::unresolved relative links in the built site:"
            printf '%s\n' "$leftover"
            exit 1
          fi
          echo "all relative links resolved"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

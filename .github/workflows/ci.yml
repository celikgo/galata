# SPDX-License-Identifier: Apache-2.0
#
# The pre-merge gate. Charter rule 1: this file exists before feature #1, and
# there is never a commit that adds source without adding to this graph.
#
# Every job here checks something a reader of the repository cannot otherwise
# verify. Jobs are added in the same commit as the surface they gate, never in
# advance — a workflow that tests a capability which does not exist is the
# aspirational-documentation failure that charter rule 2 forbids.

name: CI

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit to verify (defaults to the triggering commit).
        required: false
        default: ''
        type: string
    outputs:
      source_sha:
        description: Commit accepted by every required check.
        value: ${{ jobs.ci-ok.outputs.source_sha }}
  # EVERY pull request, whatever its base. The `branches: [main, master]` filter
  # that used to sit here meant a PR based on another feature branch never fired
  # this workflow, and GitHub then reported ZERO checks rather than a failure —
  # which reads on the PR page as "nothing to see" instead of "never tested".
  # Measured on 2026-09-10: of the fifteen open quadrotor-programme PRs, the
  # seven stacked ones had no checks at all, and those seven were the
  # identification and sampled-control verticals. ADR-0019 records the decision
  # and its cost.
  pull_request:
  push:
    branches: [main, master]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: "1"
  EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify immutable source identity
        id: source
        shell: bash
        run: python3 scripts/check-ci-source.py

      # Pinned to an exact build, from pip rather than apt. clang-format's
      # output changes between major versions, so an unpinned gate flaps
      # whenever the runner image rolls, and a developer cannot reproduce the
      # failure locally. The pip package is the same binary on every platform.
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install clang-format 20.1.8
        run: |
          python -m pip install --quiet 'clang-format==20.1.8'
          clang-format --version

      - name: C++ sources match .clang-format
        run: |
          files="$(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' '*.c' '*.mm')"
          if [ -z "$files" ]; then
            echo "::error::no C/C++ sources found — this job would be vacuously green"
            exit 1
          fi
          printf '%s\n' "$files" | xargs clang-format --dry-run --Werror

      - name: Shell scripts
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          scripts="$(git ls-files '*.sh')"
          [ -n "$scripts" ] || exit 0
          printf '%s\n' "$scripts" | xargs shellcheck --severity=warning

  engine:
    name: Engine (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,   os: ubuntu-24.04,  preset: ci-linux-gcc }
          - { name: linux-clang, os: ubuntu-24.04,  preset: ci-linux-clang }
          - { name: macos,       os: macos-14,      preset: ci-macos }
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify immutable source identity
        id: source
        shell: bash
        run: python3 scripts/check-ci-source.py

      - uses: ./.github/actions/setup-cpp
        with:
          preset: ${{ matrix.preset }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package and verify the relocated macOS desktop candidate
        if: matrix.name == 'macos'
        run: >-
          python3 scripts/package-desktop.py "build/${{ matrix.preset }}"
          --output-dir build/desktop-candidate-assets

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'macos'
        with:
          name: desktop-candidate-${{ inputs.source_sha || github.sha }}
          path: build/desktop-candidate-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Install and consume the relocated C++ package
        shell: bash
        run: python3 scripts/check-install.py "build/${{ matrix.preset }}"

      # docs/VERIFICATION.md is generated, not written. Regenerating it here and
      # diffing is what makes its numbers trustworthy: a V&V report that has
      # drifted from the implementation is worse than none, because it still
      # looks like evidence. Run on one platform only — the report is
      # build-independent by construction, and checking it three times would only
      # add two chances for a platform-specific formatting difference to break
      # an unrelated job.
      - name: Published V&V report matches what the code produces
        if: matrix.name == 'linux-gcc'
        shell: bash
        run: |
          scripts/gen-verification.sh \
            "build/${{ matrix.preset }}/tools/validation/galata-validation-report" --check

      # Charter rule 2. The README's capability table is generated from the
      # registry the CLI dispatches through, so it cannot describe a capability
      # that does not exist — provided this check runs.
      - name: README capability table matches the registry
        if: matrix.name == 'linux-gcc'
        shell: bash
        run: scripts/gen-status-table.sh "build/${{ matrix.preset }}/src/cli/galata" --check

      # The social preview card is drawn from a run, not from numbers typed into
      # a drawing script. This is what keeps that true: if the model or the
      # classifier moves, the committed poles stop matching and this fails,
      # rather than the card quietly going on asserting the old ones.
      - name: Social preview poles match what the chain produces
        if: matrix.name == 'linux-gcc'
        shell: bash
        run: scripts/gen-modal-map.sh "build/${{ matrix.preset }}/tools/social/galata-modal-map" --check

      # The card itself, not just the numbers behind it. modal-map.json was
      # gated from the start and the picture drawn from it was not, so the
      # version caption sat at 0.2.0 from 1b403cf until this step existed while
      # every job stayed green. Only the SVG is compared: it is deterministic
      # text, it needs no librsvg, and the PNG is a rasterisation of it that
      # would gate on the runner's renderer rather than on galata.
      - name: The social preview card matches its run
        if: matrix.name == 'linux-gcc'
        shell: bash
        run: python3 scripts/gen-social-preview.py --check

      # The NT-33A report page is drawn from a run too, and more is at stake
      # than with the card: it is the artefact an engineer would actually read,
      # and a page that has drifted from the code still looks like evidence.
      # Two gates, because there are two artefacts. The run record is compared
      # NUMERICALLY, since it is downstream of a central difference and ADR-0004
      # claims no cross-platform bound for such values. The page is compared as
      # TEXT, because it is a pure function of that record.
      - name: The NT-33A run record matches what the chain produces
        if: matrix.name == 'linux-gcc'
        shell: bash
        run: scripts/gen-report.sh "build/${{ matrix.preset }}/tools/report/galata-report-data" --check

      - name: The published NT-33A report page matches its run record
        if: matrix.name == 'linux-gcc'
        shell: bash
        run: python3 scripts/gen-report-page.py --check

      # The quickstart in the README is a promise. This is the only thing that
      # keeps it true.
      - name: The shipped example runs
        if: matrix.name == 'linux-gcc'
        shell: bash
        run: |
          "build/${{ matrix.preset }}/src/cli/galata" --version
          "build/${{ matrix.preset }}/src/cli/galata" capabilities
          "build/${{ matrix.preset }}/src/cli/galata" run \
            examples/nt33a-lateral-modes/modal-study.yaml --output-dir "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/lateral-modes.md"
          # The multirotor path, whose starting point differs from the fixed-wing
          # one: four rotors with four different thrust coefficients.
          "build/${{ matrix.preset }}/src/cli/galata" run \
            examples/quadrotor-heterogeneous-rotors/study.yaml \
            --output-dir "$RUNNER_TEMP/hetero"
          test -s "$RUNNER_TEMP/hetero/heterogeneous-hover.md"
          test -s "$RUNNER_TEMP/hetero/operating-point.yaml"

  # Charter gates. Seconds, not minutes — a PR that violates one should hear
  # about it before the compilers have finished warming up. Each step maps to a
  # numbered rule in docs/CHARTER.md.
  governance:
    name: Charter gates
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify immutable source identity
        id: source
        shell: bash
        run: python3 scripts/check-ci-source.py

      - name: Assurance gates reject invalid evidence
        run: python3 -m unittest discover -s tests/scripts -v

      - name: Rule 3 — one source of version truth
        run: scripts/check-version-consistency.sh

      - name: Rule 5 — strict SI in the numerical core
        run: scripts/check-si-boundary.sh

      - name: Rule 4 — every URL in every document resolves
        run: scripts/check-doc-links.sh

      # The other half of rule 4, and the cheaper half — it needs no network.
      # Added after a correction pass found three rotted names among nine untrue
      # ADR claims, every one of which had passed review.
      - name: Rule 4 — every path and test name in every document resolves
        run: scripts/check-doc-references.sh

  # 120 minutes, not the 60 every other job gets. This job is measurably the
  # most expensive one: a Debug build under ASan and UBSan, and 466 tests run
  # one at a time. The tests that dominate are the ones exercising the isolated
  # worker, because an instrumented worker hashes its whole executable and
  # runtime inventory on every run and the sanitizer binary is 90 MB against the
  # ordinary build's 29 MB — about 39 s each on this runner. At 60 minutes the
  # job was cancelled at test 379 of 466 with nothing wrong. The budget is the
  # cost of the gate, not a tolerance on any result.
  sanitizer:
    name: Address and undefined-behaviour sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify immutable source identity
        id: source
        shell: bash
        run: python3 scripts/check-ci-source.py
      - uses: ./.github/actions/setup-cpp
        with: { preset: asan }
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  static-analysis:
    name: Clang static analyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify immutable source identity
        id: source
        shell: bash
        run: python3 scripts/check-ci-source.py
      - uses: ./.github/actions/setup-cpp
        with: { preset: ci-linux-clang }
      - run: sudo apt-get install -y --no-install-recommends clang-tidy-18
      - name: Configure analyzer checks on production sources
        run: >-
          cmake --preset ci-linux-clang -B build/ci-static
          -DGALATA_BUILD_TESTS=OFF
          '-DCMAKE_CXX_CLANG_TIDY=clang-tidy-18;-checks=-*,clang-analyzer-*;-warnings-as-errors=clang-analyzer-*'
      - run: cmake --build build/ci-static --parallel 2

  determinism:
    name: Determinism
    uses: ./.github/workflows/determinism.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}

  # The one context branch protection should require: it fans in every job
  # above, so adding a job never means editing branch settings, and a skipped
  # job can never be mistaken for a passing one. That is the intent, not yet
  # the configuration — `main` carries no branch-protection rule and no
  # ruleset today, so nothing is required of a pull request mechanically.
  ci-ok:
    name: CI
    outputs:
      source_sha: ${{ steps.evidence.outputs.source_sha }}
    if: always()
    needs: [format, governance, engine, sanitizer, static-analysis, determinism]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify immutable source identity
        id: source
        shell: bash
        run: python3 scripts/check-ci-source.py
      - name: Verify every required job succeeded for this source
        id: evidence
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EVIDENCE_PATH: ${{ runner.temp }}/ci-evidence.json
        run: python3 scripts/check-ci-results.py
      - uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ inputs.source_sha || github.sha }}
          path: ${{ runner.temp }}/ci-evidence.json
          if-no-files-found: error

# SPDX-License-Identifier: Apache-2.0
name: Challenge a published number
description: A value in docs/VERIFICATION.md, the README or a release note is wrong, or disagrees with a source you have.
title: "[validation] "
labels: ["validation"]
body:
  - type: markdown
    attributes:
      value: >-
        **This is the most valuable issue you can open here.** Every number this
        project publishes is meant to be falsifiable, and a reader who has the
        source in front of them is better placed than the maintainer to find a
        transcription error. `docs/VERIFICATION.md` is generated by the
        validation run and diffed by CI, so if a number there is wrong, the code
        that produced it is wrong too.
  - type: input
    id: claim
    attributes:
      label: Which number
      description: Quote it, and say where you found it.
      placeholder: "docs/VERIFICATION.md — 'dimensional derivatives to 0.26%'"
    validations: { required: true }
  - type: textarea
    id: source
    attributes:
      label: The source you are comparing against
      description: >-
        Document, edition, year, and the page or table the value is on. If it is
        a scan, its identifier or checksum if you have one. A value with no
        locatable source cannot be gated, and ADR-0007 sets out the rights
        position on committing reference values at all.
    validations: { required: true }
  - type: textarea
    id: disagreement
    attributes:
      label: Published value, galata's value, and the deviation
      description: If you ran it, paste the output rather than retyping the numbers.
      render: text
    validations: { required: true }
  - type: textarea
    id: rounding
    attributes:
      label: Does the source's own printing precision account for it?
      description: >-
        Optional, but it is the first question review will ask. Several published
        deviations in this project are *smaller* than the rounding of the inputs
        that produced them, and one recorded discrepancy is in the published
        source rather than in the code.

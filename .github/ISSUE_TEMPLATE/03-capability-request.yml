# SPDX-License-Identifier: Apache-2.0
name: Capability request
description: Something galata should be able to do and cannot.
title: "[capability] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Check [the roadmap](https://github.com/celikgo/galata/blob/main/docs/ROADMAP.md)
        first — control synthesis and the nonlinear simulation loop are known
        gaps and are the point of the project, not oversights.
  - type: textarea
    id: what
    attributes:
      label: What it should do
    validations: { required: true }
  - type: textarea
    id: gate
    attributes:
      label: What would prove it works
      description: >-
        **This is the part that decides whether it gets built.** Charter rule 1
        says a capability ships with its gate and its tests in the same commit,
        and no capability may be documented before it works. So: a published
        worked example, a closed-form solution, an identity between two
        independent computations — something a stranger can check. A capability
        with no available gate can still be built; it will be marked
        `unvalidated` in docs/VERIFICATION.md, and that is a real cost.
    validations: { required: true }
  - type: textarea
    id: use
    attributes:
      label: What you would use it for

<text class="s" x="64" y="226" fill="#E6EDF3" font-size="22" font-weight="500">Flight dynamics and control-law design</text>
<text class="s" x="64" y="268" fill="#93A1AF" font-size="18">Trim a nonlinear aircraft, linearise about</text>
<text class="s" x="64" y="294" fill="#93A1AF" font-size="18">the trim, and read off a modal table whose</text>
<text class="s" x="64" y="320" fill="#93A1AF" font-size="18">labels come from eigenvector participation,</text>
<text class="s" x="64" y="346" fill="#93A1AF" font-size="18">not from frequency order.</text>

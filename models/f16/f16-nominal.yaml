# F-16 nominal derivative slice derived from NASA simupy-flight.
# The source boundary and limitations are recorded in PROVENANCE.md.

description: >-
  F-16 — clean nominal local derivative slice, alpha = 5 degrees, beta = 0,
  V = 300 ft/s

citation: >-
  NASA, simupy-flight, NESC Case 11 F-16 model, public repository revision
  70754e6916afc206e8c0abb386d1a9c98bf8f561. See models/f16/PROVENANCE.md.

geometry:
  # F16_aero.py, original units ft^2 / ft / ft.
  wing_area_m2: 27.870912
  wing_span_m: 9.144
  mean_aerodynamic_chord_m: 3.450336

mass:
  # F16_model.py reports 637.26 slug; F16_inertia.py is evaluated at 25% MAC.
  # The positive source Ixz product is converted by the loader's aerospace
  # off-diagonal convention.

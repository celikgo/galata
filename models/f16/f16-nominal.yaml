  inertia_xx_kg_m2: 12874.84464613
  inertia_yy_kg_m2: 75673.60773790
  inertia_zz_kg_m2: 85552.09532127
  product_of_inertia_xz_kg_m2: 1331.41295730

thrust_incidence_rad: 0.0


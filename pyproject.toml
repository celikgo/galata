[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galata-engineering"
version = "0.3.0"
description = "Machine-readable Python workflow and offline plots for Galata studies"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
png = ["cairosvg>=2.7"]

[tool.setuptools.packages.find]
where = ["python"]

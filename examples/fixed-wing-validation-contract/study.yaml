# SPDX-License-Identifier: Apache-2.0
#
# End-to-end vehicle validation wiring. The record is synthetic and is included
# only to exercise the import, window-separation and numerical acceptance gates.
# It is not flight-test evidence.
version: 1

stages:
  - id: vehicle
    capability: model.vehicle
    input:
      kind: fixed-wing
      path: ../../models/nt33a/nt33a-fc1.yaml

  - id: record
    capability: data.import.csv
    input:
      path: trajectory.csv
      time_column: time_s
      description: "synthetic fixed-wing trajectory generated by the NT-33A trim"
      channels:
        - {column: "state:position_north_m", name: p_n_m, unit: "m", frame: ned}
        - {column: "state:position_east_m", name: p_e_m, unit: "m", frame: ned}
        - {column: "state:position_down_m", name: p_d_m, unit: "m", frame: ned}
        - {column: "state:velocity_u_m_s", name: u_m_s, unit: "m/s", frame: frd}
        - {column: "state:velocity_v_m_s", name: v_m_s, unit: "m/s", frame: frd}
        - {column: "state:velocity_w_m_s", name: w_m_s, unit: "m/s", frame: frd}
        - {column: "state:quaternion_w", name: quat_w, unit: "1", frame: none}
        - {column: "state:quaternion_x", name: quat_x, unit: "1", frame: none}
        - {column: "state:quaternion_y", name: quat_y, unit: "1", frame: none}
        - {column: "state:quaternion_z", name: quat_z, unit: "1", frame: none}
        - {column: "state:roll_rate_rad_s", name: p_rad_s, unit: "rad/s", frame: frd}
        - {column: "state:pitch_rate_rad_s", name: q_rad_s, unit: "rad/s", frame: frd}
        - {column: "state:yaw_rate_rad_s", name: r_rad_s, unit: "rad/s", frame: frd}
        - {column: "control:elevator_rad", name: elevator_rad, unit: "rad", frame: body-FRD}
        - {column: "control:aileron_rad", name: aileron_rad, unit: "rad", frame: body-FRD}
        - {column: "control:rudder_rad", name: rudder_rad, unit: "rad", frame: body-FRD}
        - {column: "control:thrust_n", name: thrust_n, unit: "N", frame: body-FRD}

  # These windows retain the imported file identity. The validation gate can
  # therefore prove sample separation rather than trusting two file hashes.
  - id: estimation
    capability: data.window
    input:
      record: {from: record}
      start_time_s: 0.0
      end_time_s: 0.5

  - id: validation
    capability: data.window
    input:
      record: {from: record}
      start_time_s: 0.5
      end_time_s: 1.1

  - id: check
    capability: identify.validate.vehicle
    input:
      model: {from: vehicle}
      record: {from: validation}
      estimation_record: {from: estimation}
      altitude_m: 0.0
      initial_extended_state: [0, 0, 0, 69.445563829631013, 0, 2.6048600240020638,
                               0.99982430073147766, 0, 0.018744803728283514, 0, 0, 0, 0]
      initial_state_from_record:
        - {state: position_north_m, channel: p_n_m}
        - {state: position_east_m, channel: p_e_m}
        - {state: position_down_m, channel: p_d_m}
        - {state: velocity_u_m_s, channel: u_m_s}
        - {state: velocity_v_m_s, channel: v_m_s}
        - {state: velocity_w_m_s, channel: w_m_s}
        - {state: quaternion_w, channel: quat_w}
        - {state: quaternion_x, channel: quat_x}
        - {state: quaternion_y, channel: quat_y}
        - {state: quaternion_z, channel: quat_z}
        - {state: roll_rate_rad_s, channel: p_rad_s}
        - {state: pitch_rate_rad_s, channel: q_rad_s}
        - {state: yaw_rate_rad_s, channel: r_rad_s}
      step_s: 0.01
      outputs:
        - {channel: p_n_m, state: position_north_m}
        - {channel: u_m_s, state: velocity_u_m_s}
      command_channels: [elevator_rad, aileron_rad, rudder_rad, thrust_n]
      acceptance:
        outputs:
          - {channel: p_n_m, state: position_north_m, max_rmse: 1.0e-8, max_absolute_error: 1.0e-7}
          - {channel: u_m_s, state: velocity_u_m_s, max_rmse: 1.0e-8, max_absolute_error: 1.0e-7}

  - id: report
    capability: report.markdown
    input:
      title: Synthetic fixed-wing validation contract
      path: validation.md
      sections: [{from: check}]

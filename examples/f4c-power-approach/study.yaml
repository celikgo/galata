# SPDX-License-Identifier: Apache-2.0
#
# NASA CR-2144 F-4C power-approach derivative set through the ordinary
# nonlinear aircraft workflow. This is a source-transcription regression and
# example, not an airworthiness or aircraft-validation claim.

version: 1

stages:
  - id: aircraft
    capability: model.aircraft.derivatives
    input:
      path: ../../models/f4c/f4c-power-approach.yaml

  - id: trim
    capability: trim.level
    input:
      aircraft: { from: aircraft }
      altitude_m: 0.0
      airspeed_m_s: 70.104
      flight_path_angle_deg: 0.0
      tolerance: 1.0e-10

  - id: longitudinal
    capability: linearize.finitediff
    input:
      trim_point: { from: trim }
      axes: longitudinal
      report_truncation_error: true

  - id: lateral
    capability: linearize.finitediff
    input:
      trim_point: { from: trim }
      axes: lateral
      report_truncation_error: true

  - id: longitudinal_modes
    capability: analyze.modes
    input:
      system: { from: longitudinal }
      classify: true

  - id: lateral_modes
    capability: analyze.modes
    input:
      system: { from: lateral }
      classify: true

  - id: report
    capability: report.markdown
    input:
      title: F-4C — power approach trim, linearisation and modes
      sections:
        - { from: trim }
        - { from: longitudinal }
        - { from: longitudinal_modes }
        - { from: lateral }
        - { from: lateral_modes }
      path: trim-and-modes.md

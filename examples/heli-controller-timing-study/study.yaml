# SPDX-License-Identifier: Apache-2.0

version: 1

stages:
  - id: aircraft
    capability: model.helicopter
    input: {path: ../../models/souxmar-heli/souxmar-heli.yaml}
  - id: cruise
    capability: trim.helicopter
    input: {helicopter: {from: aircraft}, airspeed_m_s: 40.0, altitude_m: 500.0}
  - id: sample_10ms_delay_0
    capability: sim.helicopter.closed_loop
    input:
      trim: {from: cruise}
      controller_period_s: 0.01
      step_s: 0.002
      steps: 3000
      sample_stride: 10
      delay_periods: 0
      controller:
        type: pid
        missing_measurement: refuse
        loops:
          - {measurement: roll_rate_rad_s, control: lateral_cyclic_command_rad, kp: -0.15, ki: 0.0, kd: 0.0, derivative_filter_s: 0.02}
          - {measurement: pitch_rate_rad_s, control: longitudinal_cyclic_command_rad, kp: -0.15, ki: 0.0, kd: 0.0, derivative_filter_s: 0.02}
          - {measurement: yaw_rate_rad_s, control: pedal_command_rad, kp: -0.08, ki: 0.0, kd: 0.0, derivative_filter_s: 0.02}
  - id: sample_20ms_delay_1
    capability: sim.helicopter.closed_loop
    input:
      trim: {from: cruise}
      controller_period_s: 0.02
      step_s: 0.002
      steps: 3000
      sample_stride: 10
      delay_periods: 1
      controller:
        type: pid
        missing_measurement: refuse
        loops:
          - {measurement: roll_rate_rad_s, control: lateral_cyclic_command_rad, kp: -0.15, ki: 0.0, kd: 0.0, derivative_filter_s: 0.02}
          - {measurement: pitch_rate_rad_s, control: longitudinal_cyclic_command_rad, kp: -0.15, ki: 0.0, kd: 0.0, derivative_filter_s: 0.02}
          - {measurement: yaw_rate_rad_s, control: pedal_command_rad, kp: -0.08, ki: 0.0, kd: 0.0, derivative_filter_s: 0.02}
  - id: report
    capability: report.markdown
    input:
      title: Souxmar F1 controller sample-time and delay study
      sections: [{from: cruise}, {from: sample_10ms_delay_0}, {from: sample_20ms_delay_1}]
      path: timing-study.md

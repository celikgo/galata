#
# THE STARTING POINT of this example's fit, and NOT a description of any
# aircraft. It is `quad-truth.yaml` with two parameters deliberately set wrong:
#
#   mass.mass_kg           1.45  against the truth's 1.6    (9.4 percent light)
#   drag.angular_n_m_s[1]  0.004 against the truth's 0.002  (twice as damped)
#
# Every other number is the truth model's, and `identify.greybox` must leave
# every one of them exactly as it found it — which the exported provenance file
# lists by name so a reader can check rather than assume.
#
# Two parameters, chosen because they are separable by this record. Mass sets
# the scale of the vertical response; pitch angular drag sets the decay of the
# body pitch rate. A record that pitches and climbs sees both, separately. Mass
# together with a single rotor's thrust coefficient would NOT be separable from
# a vertical manoeuvre alone — both scale the same acceleration — and
# `identify.greybox` refuses such a pair rather than reporting a number for a
# direction the data cannot see.

description: "Starting point for the identification self-test — the nominal quadrotor with its mass and pitch angular drag deliberately wrong"
citation: "Souxmar forest-ISR programme, nonlinear quadrotor plant (fcs/plant/quadrotor.py), nominal coefficient set published in outputs/galata_bridge/reference_trajectory.json; an independent implementation, not measured aircraft data and not a published source"

mass:
  mass_kg: 1.45
  inertia_xx_kg_m2: 0.023
  inertia_yy_kg_m2: 0.023
  inertia_zz_kg_m2: 0.042

# Rotor order is the fixture's column order: front-left, rear-left, rear-right,
# front-right. Hub positions are the X-configuration geometry of a 0.23 m arm,
# 0.23 / sqrt(2) in each of body x and y, with the rotor plane through the CG.
rotors:
  - position_cg_to_hub_body_m: [0.16263455967290593, -0.16263455967290593, 0.0]
    spin_about_body_z: 1
    thrust_coefficient_n_s2: 1.0e-5
    torque_coefficient_n_m_s2: 1.7e-7
    speed_time_constant_s: 0.035
    minimum_speed_rad_s: 0.0
    maximum_speed_rad_s: 1102.4200493562662
  - position_cg_to_hub_body_m: [-0.16263455967290593, -0.16263455967290593, 0.0]
    spin_about_body_z: -1
    thrust_coefficient_n_s2: 1.0e-5
    torque_coefficient_n_m_s2: 1.7e-7
    speed_time_constant_s: 0.035
    minimum_speed_rad_s: 0.0
    maximum_speed_rad_s: 1102.4200493562662
  - position_cg_to_hub_body_m: [-0.16263455967290593, 0.16263455967290593, 0.0]
    spin_about_body_z: 1
    thrust_coefficient_n_s2: 1.0e-5
    torque_coefficient_n_m_s2: 1.7e-7
    speed_time_constant_s: 0.035
    minimum_speed_rad_s: 0.0
    maximum_speed_rad_s: 1102.4200493562662
  - position_cg_to_hub_body_m: [0.16263455967290593, 0.16263455967290593, 0.0]
    spin_about_body_z: -1
    thrust_coefficient_n_s2: 1.0e-5
    torque_coefficient_n_m_s2: 1.7e-7
    speed_time_constant_s: 0.035
    minimum_speed_rad_s: 0.0
    maximum_speed_rad_s: 1102.4200493562662

drag:
  linear_n_s_m: [0.12, 0.12, 0.18]
  quadratic_n_s2_m2: [0.025, 0.025, 0.035]
  angular_n_m_s: [0.002, 0.004, 0.003]
